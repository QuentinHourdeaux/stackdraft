name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.1

      - name: Install locked dependencies
        run: deno install --frozen

      - name: Verify application
        run: deno task ci

      - name: Build container
        run: docker build .
